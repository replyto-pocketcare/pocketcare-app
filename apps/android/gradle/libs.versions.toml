# Version catalog. Versions below were verified against
# developer.android.com/build/releases/about-agp (compatibility table) and
# search on 2026-07-31 — see apps/android/README.md "Version audit" note for
# the reasoning. CHECK FOR NEWER STABLE RELEASES before relying on this
# long-term (plan §2: "latest stable at execution time — executors check
# versions, don't assume"). Bump via Android Studio's AGP Upgrade Assistant
# or by hand; this file is the single place versions live.
#
# Deliberately stayed on the AGP 8.x line (8.13.0) rather than jumping to the
# 9.x line (9.2.0 latest at audit time): AGP 9.0+ introduces "built-in
# Kotlin" and drops the separate kotlin-android plugin, a structural DSL
# migration that can't be verified in this sandbox (no JDK/Gradle). AGP
# 8.13.0 is current within the 8.x line, keeps the familiar kotlin-android +
# kotlinOptions{} shape already in app/build.gradle.kts, and its minimum
# Gradle requirement (8.13, exact match) is a small, well-documented step up
# from the previous pin (8.7). Revisit the 9.x jump as a deliberate,
# separately-verified task once a human can actually run a build.
agp = "8.13.0"
kotlin = "2.4.10"
composeBom = "2026.06.00"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
coreKtx = "1.13.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
