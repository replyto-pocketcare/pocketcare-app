# Version catalog. Versions below were verified against
# developer.android.com/build/releases/about-agp (compatibility table) and
# developer.android.com/build/migrate-to-built-in-kotlin on 2026-07-31 — see
# apps/android/README.md "Version audit" note for the reasoning. CHECK FOR
# NEWER STABLE RELEASES before relying on this long-term (plan §2: "latest
# stable at execution time — executors check versions, don't assume"). Bump
# via Android Studio's AGP Upgrade Assistant or by hand; this file is the
# single place versions live.
#
# On AGP 9.x now (9.2.0 — the newest version with a fully documented Gradle
# minimum at audit time; 9.3 exists but developer.android.com's own
# compatibility table hadn't listed its minimum Gradle version yet, so it
# wasn't used here). AGP 9.0+ ships "built-in Kotlin": the separate
# kotlin-android plugin is gone (see the migration guide URL above) — :app's
# build file no longer applies `kotlin.android` at all. `kotlin` here is
# still needed for :domain's plain `kotlin.jvm` plugin (unaffected, it's not
# an Android module) and for the `compose.compiler` plugin's version.

[versions]
agp = "9.2.0"
kotlin = "2.4.10"
composeBom = "2026.06.00"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
coreKtx = "1.13.1"
# Human-approved 2026-07-31 for P0.4a (golden-vector runner): :domain is a
# pure-JVM module with no Android SDK, so it has no built-in JSON parser.
# kotlinx.serialization is JetBrains-official and the standard Kotlin
# choice; version confirmed compatible with Kotlin 2.4.10 via search.
# Test-scope only, does not ship in the app.
kotlinxSerializationJson = "1.11.0"
# P2.2/P2.4: PowerSync Kotlin SDK — approved irreducible dependency (plan §0;
# "PowerSync native SDK" is on the allowed list). Version 1.13.0 is the
# latest stable as of July 2026 (Maven Central); com.powersync:core is the
# KMP artifact, includes Android support.
powerSync = "1.13.0"
# P2.2/P2.4: supabase-kt BOM — approved irreducible dependency (plan §0;
# "Supabase SDK" on the allowed list). 3.6.0 is the latest stable as of
# July 2026. Requires Ktor 3.x as the HTTP engine.
supabaseBom = "3.6.0"
# Ktor OkHttp engine for Android (required by supabase-kt on Android).
ktor = "3.1.3"
koin = "4.0.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
# P2.2/P2.4 — data layer (approved irreducible set, plan §0)
powersync-core = { group = "com.powersync", name = "core", version.ref = "powerSync" }
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabaseBom" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# :data uses com.android.library (not application) — same AGP version.
android-library = { id = "com.android.library", version.ref = "agp" }
# kotlin-android (org.jetbrains.kotlin.android) intentionally removed here —
# AGP 9.0+ built-in Kotlin replaces it for Android modules; applying it
# alongside AGP 9.x is now a hard error ("no longer required for Kotlin
# support since AGP 9.0"). :domain still gets Kotlin via kotlin-jvm below,
# unaffected since it's a plain JVM module, not an Android one.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
