# 4G, up from 2G. `:app:packageRelease` died with OutOfMemoryError in
# zipflinger (CI run 32715145186) — not a code failure, the packager simply ran
# out of heap. The APK has grown: three locales of generated strings, two
# bundled font files, and the full Compose + PowerSync + Supabase dependency
# set. GitHub's ubuntu-latest runner has 16G, so 4G for the Gradle daemon is
# comfortable rather than optimistic.
#
# MaxMetaspaceSize is set explicitly because the default is unbounded, and an
# unbounded metaspace on a heap-constrained runner turns one OOM into two.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# ---------------------------------------------------------------------------
# Sanvya runtime configuration.
#
# These used to be string literals inside DataModule.kt, which meant a build
# for a different Supabase project needed a source edit. They are ordinary
# Gradle properties now, so the resolution order is the usual one:
#
#   -Psanvya.foo=…  >  local.properties  >  the defaults below
#
# (settings.gradle.kts folds local.properties in — see the note there.)
#
# The values below are the dev project's, and were already committed in
# source, so nothing new is exposed by them being here. The anon key is a
# publishable key by design: it carries no privileges beyond RLS. Anything
# genuinely secret belongs in local.properties, which git ignores.
# ---------------------------------------------------------------------------
sanvya.supabaseUrl=https://iagsmqtjadzdhcjdysno.supabase.co
sanvya.supabaseAnonKey=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhZ3NtcXRqYWR6ZGhjamR5c25vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5ODYzODUsImV4cCI6MjA5ODU2MjM4NX0.Yh4VE6Nd_UDAXYfk_qKsm3C6PGhxq6kMxVO53ITw6Qc
sanvya.powerSyncUrl=https://6a464d1c68bc6e1f7cad8804.powersync.journeyapps.com

# Where the OAuth provider sends the browser back to. Must match an entry in
# Supabase's Authentication > URL Configuration > Redirect URLs allowlist, and
# the manifest intent filter is generated from these two values (see
# app/build.gradle.kts manifestPlaceholders) so they can never drift apart.
#
# Scheme is the applicationId rather than a bare word like "sanvya": a custom
# scheme is first-come-first-served across the whole device, and reverse-DNS is
# the only form that is actually unique. iOS uses the same pair.
sanvya.authRedirectScheme=com.sanvya.app
sanvya.authRedirectHost=auth-callback

# The SUPPORT public key (a JWK document) that a "content" support grant
# re-wraps the user's DEK for. Empty here on purpose: this repo has no support
# keypair committed, and web is in exactly the same state (its
# NEXT_PUBLIC_SUPPORT_PUBLIC_JWK is a deployment env var, not a source value).
# Empty means the Security panel refuses a data-access grant with "Support
# access is not configured for this deployment." -- web's own wording, from
# web's own branch. A deployment that HAS a keypair puts the single-line public
# JWK printed by scripts/gen-support-key.ts into local.properties.
sanvya.supportPublicJwk=
