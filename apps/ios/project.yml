# XcodeGen spec — the source of truth for PocketCare.xcodeproj (generated,
# not committed; run `xcodegen generate` after cloning/pulling — see
# README.md). Rationale for XcodeGen over a hand-edited/committed .xcodeproj:
# a project.yml diffs and merges like any text file; a raw .pbxproj does not.
name: Sanvya
options:
  bundleIdPrefix: care.pocket
  deploymentTarget:
    iOS: "17.0"
  # PLACEHOLDER — confirm the real minimum iOS version before shipping
  # (plan §10; same class of open item as Android's minSdk proposal).

packages:
  Domain:
    path: Domain
  # P2.2b/P2.4b: Data package holds SupabaseConnector + Auth (approved
  # irreducible dependencies: PowerSync Swift SDK + supabase-swift).
  Data:
    path: Data
  Factory:
    url: https://github.com/hmlongco/Factory
    from: 2.3.2

targets:
  Sanvya:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "PocketCare.entitlements"
    dependencies:
      - package: Domain
      - package: Data
      - package: Factory
    # Backend configuration. Config/Sanvya.xcconfig holds the committed
    # defaults and optionally #include?s a git-ignored Sanvya.local.xcconfig,
    # so pointing a build at a different Supabase project never touches a
    # tracked file. See that file's header for why the hosts carry no scheme.
    configFiles:
      Debug: Config/Sanvya.xcconfig
      Release: Config/Sanvya.xcconfig
    settings:
      base:
        # PLACEHOLDER bundle id — confirm the real reverse-DNS id before any
        # store submission (plan §10; same open item the RN scaffold hit).
        PRODUCT_BUNDLE_IDENTIFIER: com.sanvya.app
        # iPhone + iPad. Already the Xcode default; stated so nobody has to
        # look it up to know the iPad build is deliberate (W1.5).
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: App/Sanvya.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # "6" not "6.0" — Xcode's SWIFT_VERSION (Swift Language Version)
        # build setting takes major-version-only language-mode values (4,
        # 4.2, 5, 6), not toolchain patch versions. Verified via search
        # 2026-07-31 before the first real xcodegen/xcodebuild attempt.
        SWIFT_VERSION: "6"
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Generated/Sanvya-Info.plist
      properties:
        CFBundleDisplayName: Sanvya
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Push. Without `remote-notification` iOS delivers a silent/background
        # payload to a suspended app and nothing else -- the app is simply never
        # woken. It was missing entirely, which is one of the reasons the push
        # feature could look wired and still do nothing.
        UIBackgroundModes:
          - remote-notification
        # Orientation policy (Akhilesh, 2026-08-23): phones portrait, tablets
        # free. Declared rather than set at runtime, so the system applies it
        # before the first frame instead of after one has already been laid out
        # the wrong way round.
        #
        # There is no shipping iOS foldable and no hinge API to ask about one.
        # If that changes it joins the ~ipad row -- see
        # docs/mobile/screen-specs/app-shell.md §1b.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Dictation into the assistant's composer. BOTH are required and the
        # app is killed on launch of the feature without them -- SFSpeechRecognizer
        # needs the speech string, and the audio engine that feeds it needs the
        # microphone one. The camera has no entry here because this app has no
        # camera capture on iOS yet; when it does, its own string goes beside
        # these.
        NSMicrophoneUsageDescription: >-
          Sanvya uses the microphone only while you hold a conversation with the
          assistant, so you can speak instead of typing. Nothing is recorded or
          stored.
        NSSpeechRecognitionUsageDescription: >-
          Speech recognition turns what you say into text in the assistant's
          message box. Sanvya asks iOS to do this on your device wherever your
          language supports it.
        # Bundled faces. Inter is the app typeface (variable, so the design's
        # 550/650 weights resolve exactly — see App/Theme/Font.swift); the
        # icon face is the same Material Symbols subset web serves, so a glyph
        # is identical across all three platforms. Rebuild both with
        # tools/parity/build-fonts.sh.
        UIAppFonts:
          - InterVariable.ttf
          - SanvyaIcons.ttf
        # Backend configuration, surfaced from the xcconfig above. Info.plist
        # is how a build setting reaches runtime code; SanvyaConfig.swift is
        # the only type that reads these keys back.
        SanvyaSupabaseHost: $(SANVYA_SUPABASE_HOST)
        SanvyaSupabaseAnonKey: $(SANVYA_SUPABASE_ANON_KEY)
        SanvyaPowerSyncHost: $(SANVYA_POWERSYNC_HOST)
        SanvyaAuthRedirectScheme: $(SANVYA_AUTH_REDIRECT_SCHEME)
        SanvyaAuthRedirectHost: $(SANVYA_AUTH_REDIRECT_HOST)
        SanvyaSupportPublicJwk: $(SANVYA_SUPPORT_PUBLIC_JWK)
        # Claims the OAuth callback scheme with the OS. Without this entry the
        # provider redirect goes nowhere and the sign-in silently never
        # completes -- ASWebAuthenticationSession matches the callback against
        # the scheme it was given, and the scheme has to be registered for the
        # app to be a legal target for it.
        #
        # Generated from the same build setting the Supabase client is
        # configured from, so the URI the app asks Google to return to and the
        # URI this app is registered to receive cannot drift apart.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(SANVYA_AUTH_REDIRECT_SCHEME)
            CFBundleURLSchemes:
              - $(SANVYA_AUTH_REDIRECT_SCHEME)

  SanvyaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: Sanvya
      - package: Domain
    settings:
      base:
        # Real build error on first xcodebuild attempt: "Cannot code sign
        # because the target does not have an Info.plist file and one is
        # not being generated automatically." Unlike PocketCare above,
        # this target has no `info:` block, and XcodeGen doesn't imply
        # GENERATE_INFOPLIST_FILE for bundle.unit-test targets — it has to
        # be set explicitly. Using auto-generation (the error's own
        # recommended fix) rather than hand-writing a plist for a test
        # bundle that has no real Info.plist content to speak of.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Sanvya:
    build:
      targets:
        Sanvya: all
        SanvyaTests: [test]
    test:
      targets:
        - SanvyaTests
    run:
      config: Debug
