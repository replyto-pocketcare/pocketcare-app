name: CI

# Financial-grade gate: typecheck, unit tests (incl. AI guardrail + offline-sync
# reconciliation), build, and e2e must pass before production is promoted.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder public envs so the build/boot never crashes on `undefined`.
  # Real values come from repo secrets (fall back to dummies for PR forks).
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'public-anon-placeholder' }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'public-publishable-placeholder' }}
  NEXT_PUBLIC_POWERSYNC_URL: ${{ secrets.NEXT_PUBLIC_POWERSYNC_URL || 'https://example.powersync.journeyapps.com' }}

jobs:
  unit:
    name: Typecheck · lint · unit tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.7.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests (core + guardrail + reconcile)
        run: pnpm test:core
      - name: Build
        run: pnpm build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.7.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @pocketcare/web test:e2e:install
      - name: Build web app
        run: pnpm --filter @pocketcare/web build
      - name: Run e2e (smoke; full flows gated by E2E_FULL)
        run: pnpm --filter @pocketcare/web test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  android:
    name: Android — build + test (apps/android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Uses gradle/actions/setup-gradle to provision Gradle directly and
      # run the `gradle` command, NOT `./gradlew` — this scaffold's wrapper
      # jar is generated locally by a human (see apps/android/README.md;
      # the agent sandbox that wrote this skeleton has no Gradle/JDK
      # compiler to produce a trustworthy wrapper binary). Once a human
      # commits the wrapper, this can switch to `./gradlew` + wrapper
      # validation if preferred — not required either way.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"
      - name: Build + test :app and :domain
        working-directory: apps/android
        run: gradle build test --no-daemon

  ios:
    name: iOS — build + test (apps/ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build + test (Domain package + App scheme, simulator)
        working-directory: apps/ios
        run: |
          xcodebuild test \
            -project PocketCare.xcodeproj \
            -scheme PocketCare \
            -destination 'platform=iOS Simulator,name=iPhone 16'

  # Production promotion is BLOCKED unless unit + e2e are green (via `needs`).
  # Requires Vercel Git auto-deploy for production to be disabled so this is the
  # only path to prod. Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
  deploy-production:
    name: Promote to production (gated)
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.7.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest
      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build (prebuilt) for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
