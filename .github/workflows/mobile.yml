name: Mobile

# Real compilers for the native apps.
#
# This workflow exists because there is no Gradle/Xcode toolchain in the agent
# sandbox (maven.google.com, Maven Central and download.swift.org are blocked by
# egress policy), which is how ~18 tasks once got marked DONE against files that
# did not exist. See docs/mobile/PARITY_AUDIT.md §2 — CI is the compiler of
# record for apps/android and apps/ios.
#
# The `report` job writes each run's outcome and captured compiler output to the
# orphan `ci-logs` branch. That is not belt-and-braces: the agent sandbox's proxy
# refuses api.github.com/repos/... for this repository, so run status and logs
# cannot be polled the usual way — but plain git can. Push to trigger, fetch
# `ci-logs` to read the result.

on:
  push:
    branches: [main, "mobile/**"]
    paths:
      - "apps/android/**"
      - "apps/ios/**"
      - "tools/parity/**"
      - "packages/core/i18n/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/ios/**"
      - "tools/parity/**"
      - "packages/core/i18n/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      run_ios:
        description: "Run the iOS job (costs macOS runner minutes)"
        type: boolean
        default: true
      run_android:
        description: "Run the Android job"
        type: boolean
        default: true

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  parity:
    name: Generated-artifact drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm BEFORE setup-node, and pinned to the exact version package.json's
      # `packageManager` field names. Both matter, and this job got both wrong:
      # `version: 9` against `packageManager: pnpm@9.7.0` makes
      # pnpm/action-setup@v4 abort with "multiple versions of pnpm specified",
      # and setup-node's `cache: pnpm` needs pnpm already on PATH. ci.yml has
      # had this shape all along -- this is now a copy of it, not a variation.
      - uses: pnpm/action-setup@v4
        with: { version: 9.7.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # export-mobile-schema.mjs imports packages/db's AppSchema, which needs
      # @powersync/common resolvable. The other generators parse source text and
      # need nothing installed.
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      # Tokens, string catalogs and icon maps are GENERATED from the web
      # sources. Regenerating must be a no-op on a clean tree; a diff here means
      # generated output was hand-edited instead of its source.
      - name: Regenerate
        run: |
          set -o pipefail
          { node tools/parity/generate-tokens.mjs
            node tools/parity/generate-i18n.mjs
            node tools/parity/generate-icons.mjs
            node tools/parity/generate-money-format.mjs
            node tools/parity/generate-options.mjs
            # The dashboard tile catalog. Belongs here for the same reason the
            # schema export does: a tile id is user data -- it is written into
            # local storage and read back on every launch -- so a platform that
            # is one id short drops whichever tile that user had added, on that
            # device only, and looks fine to everyone testing it.
            node tools/parity/generate-tiles.mjs
            # The Help FAQ. 33 question/answer pairs that exist in one place on
            # web and would otherwise exist in three, drifting quietly -- nobody
            # re-reads a FAQ to check it still matches.
            node tools/parity/generate-help.mjs
            # The pre-auth deck's seven glyph/gradient pairs. Small, but the
            # count is load-bearing on both platforms (page dots, "is this the
            # last one"), and nobody would notice slide 4 being the wrong shade
            # of amber on one platform for a year.
            node tools/parity/generate-onboarding-slides.mjs
            # The auto-categoriser's cold-start tables: ~186 keyword->category
            # pairs plus the stop-word and noise-token sets. All three are DATA,
            # and the noise set in particular decides which tokens survive
            # normalisation at all -- one platform missing a bank code silently
            # changes what every statement row categorises as.
            node tools/parity/generate-category-seeds.mjs
            # The assistant's tool surface: seven names, their JSON schemas and
            # the descriptions the MODEL reads. Those descriptions are prompt
            # text, not documentation -- paraphrasing one changes how the model
            # behaves, so a hand-copy into two languages is a behaviour fork
            # waiting to happen.
            node tools/parity/generate-assistant-tools.mjs
            # The assistant's SYSTEM PROMPT -- its voice, its refusal scope, the
            # <ui> card grammar, the route list, and the rule separating a tool
            # call from a navigation link. A reflowed paragraph on one platform
            # is a different assistant, and nobody would attribute that to a
            # transcription.
            node tools/parity/generate-assistant-persona.mjs
            # The feedback form's AREAS and SEVERITIES. These are the values
            # written to `bug_reports` and read by whoever works the triage
            # queue, so a phone that spells an area differently from the browser
            # silently splits one bucket into two and nobody notices.
            node tools/parity/generate-feedback.mjs
            # The PowerSync client schema, mirrored into both native platforms.
            # These were NOT in this list, and that is exactly why the mirrors
            # fell four migrations behind packages/db/src/index.ts without a
            # single job ever going red. Needs node_modules, hence the install
            # step above -- unlike the five generators before it, the export
            # imports AppSchema for real rather than parsing source.
            node tools/golden-vectors/export-mobile-schema.mjs
            node tools/golden-vectors/gen-mobile-schema.mjs
          } 2>&1 | tee parity.log
      # Text greps for Swift mistakes this codebase has made more than once.
      # A separate step, not part of the regenerate block, because it FAILS
      # rather than producing a diff -- and it runs here, in a job that takes
      # seconds, rather than costing a ~10-minute macOS build and a round trip
      # through a human to push again.
      - name: Known Swift traps
        run: node tools/parity/check-swift-traps.mjs 2>&1 | tee -a parity.log
      # Same idea, other platform. Kotlin's error for a missing import names an
      # unrelated class in an unrelated library -- see the script's header --
      # so this one saves more debugging than the Swift greps do.
      - name: Kotlin imports
        run: node tools/parity/check-kotlin-imports.mjs 2>&1 | tee -a parity.log
      # A trailing lambda on a composable whose last parameter is a Modifier
      # binds to the Modifier. Twelve CI errors on one screen, none of which
      # said "trailing lambda" -- see the script's header.
      - name: Compose trailing lambdas
        run: node tools/parity/check-trailing-lambda.mjs 2>&1 | tee -a parity.log
      # Kotlin and Swift NEST block comments. A `/*` in prose inside a doc
      # comment swallows the rest of the file, and the compiler points at the
      # last line -- see the script's header.
      - name: Nested block comments
        run: node tools/parity/check-nested-comments.mjs 2>&1 | tee -a parity.log
      # CI is the compiler of record here, so a mistake this mechanical costs a
      # full round trip. These two have each already cost one.
      - name: i18n accessor arguments
        run: node tools/parity/check-i18n-args.mjs 2>&1 | tee -a parity.log
      - name: Golden-vector registration
        run: node tools/parity/check-vector-registration.mjs 2>&1 | tee -a parity.log
      # 100 is the minor-unit scale for the rupee, the dollar and the euro, and
      # wrong for the yen and the dinar. 47 sites assumed it; three of them
      # broke a save or overstated a bill by 100x.
      - name: Hardcoded money scale
        run: node tools/parity/check-money-scale.mjs 2>&1 | tee -a parity.log
      # This app ships en/hi/nl. A hardcoded label does not fail, does not warn
      # and does not look wrong in review -- it just renders English to a Hindi
      # user. Baselined at 227 sites; this only fails on NEW ones, and the
      # count can only go down.
      - name: Hardcoded user-facing strings
        run: node tools/parity/check-hardcoded-strings.mjs 2>&1 | tee -a parity.log
      - name: Fail if generated output drifted
        run: |
          if ! git diff --exit-code | tee -a parity.log; then
            echo "::error::Generated native artifacts are out of date. Run the generators in tools/parity and commit the result." | tee -a parity.log
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: log-parity, path: parity.log, retention-days: 7, if-no-files-found: ignore }

  android:
    name: Android — assemble + unit tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages for compileSdk 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      # --continue: report EVERY failing task, not just the first. Each run
      # costs a round trip through a human (the agent sandbox cannot push), so
      # a run that stops at the first broken task wastes most of its value.
      - name: Assemble + test
        working-directory: apps/android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --continue build test 2>&1 | tee ../../android.log
      # Lint prints only its FIRST failure to stdout and puts the rest in an
      # HTML/XML report — which is an artifact, and artifacts need the API the
      # agent sandbox cannot reach. So the full list is folded into the log,
      # where the ci-logs branch will carry it.
      - name: Expand the lint report
        if: always()
        run: |
          python3 - <<'PY' | tee -a android.log
          import glob, xml.etree.ElementTree as ET
          files = glob.glob("apps/android/**/build/reports/lint-results-*.xml", recursive=True)
          if not files:
              print("[lint] no XML report produced")
          for path in sorted(set(files)):
              root = ET.parse(path).getroot()
              issues = [i for i in root.iter("issue") if i.get("severity") == "Error"]
              print(f"[lint] {path}: {len(issues)} error(s)")
              for issue in issues:
                  loc = issue.find("location")
                  where = f'{loc.get("file")}:{loc.get("line")}' if loc is not None else "?"
                  print(f'  {issue.get("id")}  {where}\n    {issue.get("message")}')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: log-android, path: android.log, retention-days: 7, if-no-files-found: ignore }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/android/**/build/reports/**
            apps/android/**/build/outputs/logs/**
          retention-days: 7

  ios:
    name: iOS — xcodegen + build + tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_ios }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # project.yml is the source of truth; the .xcodeproj is derived and is not
      # committed. This is what prevents the "new .swift file was never added to
      # project.pbxproj so the app doesn't compile" bug class.
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee ../../ios.log
      # Every step records its own status and keeps going. A failing Domain
      # vector must not hide whether the SwiftUI app compiles — that is the
      # signal a macOS runner exists to produce, and losing it costs a whole
      # round trip. The job fails at the end if anything failed.
      - name: Swift packages (Domain + Data)
        id: swiftpm
        continue-on-error: true
        working-directory: apps/ios
        run: |
          set -o pipefail
          rc=0
          swift test --package-path Domain 2>&1 | tee -a ../../ios.log || rc=1
          swift build --package-path Data 2>&1 | tee -a ../../ios.log || rc=1
          exit $rc
      - name: Pick an available simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x.get('isAvailable') and 'iPhone' in x['name']))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID" | tee -a ios.log
      - name: Build + test the app scheme
        id: xcodebuild
        continue-on-error: true
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project Sanvya.xcodeproj \
            -scheme Sanvya \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee -a ../../ios.log
      - name: Fail if either stage failed
        if: steps.swiftpm.outcome == 'failure' || steps.xcodebuild.outcome == 'failure'
        run: |
          echo "swiftpm=${{ steps.swiftpm.outcome }} xcodebuild=${{ steps.xcodebuild.outcome }}"
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: log-ios, path: ios.log, retention-days: 7, if-no-files-found: ignore }

  report:
    name: Publish results to the ci-logs branch
    needs: [parity, android, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: logs, pattern: "log-*", merge-multiple: true }
      - name: Assemble and push the report
        env:
          PARITY: ${{ needs.parity.result }}
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
        run: |
          set -euo pipefail
          DIR="runs/${GITHUB_RUN_ID}-$(git rev-parse --short HEAD)"
          mkdir -p "/tmp/out/$DIR"
          {
            echo "run_id:   $GITHUB_RUN_ID"
            echo "sha:      $GITHUB_SHA"
            echo "ref:      $GITHUB_REF"
            echo "parity:   $PARITY"
            echo "android:  $ANDROID"
            echo "ios:      $IOS"
          } > "/tmp/out/$DIR/summary.txt"
          cp logs/*.log "/tmp/out/$DIR/" 2>/dev/null || true
          # Compiler errors are what the reader is actually after; hoist them so
          # a failing run can be diagnosed without paging through a full log.
          grep -hnE "error:|FAILED|FAILURE|\*\* BUILD FAILED|Compilation error|e: " logs/*.log \
            > "/tmp/out/$DIR/errors.txt" 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Orphan branch: build logs share no history with the code.
          if git ls-remote --exit-code --heads origin ci-logs >/dev/null 2>&1; then
            git fetch origin ci-logs --depth 1
            git checkout -B ci-logs origin/ci-logs
          else
            git checkout --orphan ci-logs
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "$DIR"
          cp -r "/tmp/out/$DIR/." "$DIR/"
          cp "$DIR/summary.txt" latest.txt
          git add -A "$DIR" latest.txt
          git commit -m "ci: $GITHUB_RUN_ID parity=$PARITY android=$ANDROID ios=$IOS"
          # Another run may have landed between fetch and push.
          for i in 1 2 3 4 5; do
            git push origin ci-logs && exit 0
            git fetch origin ci-logs --depth 1 && git rebase origin/ci-logs || true
            sleep $((i * 3))
          done
          echo "::error::could not push ci-logs after 5 attempts"
          exit 1
